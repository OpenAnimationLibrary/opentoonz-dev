name: Trail Settings Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'toonz/sources/include/trailcycle.h'
      - 'toonz/sources/include/trailscale.h'
      - 'toonz/sources/include/tsimplecolorstyles.h'
      - 'toonz/sources/include/toonzqt/styleeditor.h'
      - 'toonz/sources/tnztools/trailcyclestate.h'
      - 'toonz/sources/tnztools/trailstamp.h'
      - 'toonz/sources/tnztools/toonzvectorbrushtool.*'
      - 'toonz/sources/common/tvrender/tsimplecolorstyles.cpp'
      - 'toonz/sources/common/tvrender/tpalette.cpp'
      - 'toonz/sources/common/tvrender/tstrokeprop.cpp'
      - 'toonz/sources/image/pli/tiio_pli.cpp'
      - 'toonz/sources/toonzlib/stylemanager.cpp'
      - 'toonz/sources/toonzqt/styleeditor.cpp'
      - 'toonz/tests/trail_settings/**'
      - '.github/workflows/trail_settings_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  GestureState:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Compile and test gestures, click carriers and size math
        run: |
          cmake -S toonz/tests/trail_settings -B build/trail-settings
          cmake --build build/trail-settings
          ctest --test-dir build/trail-settings --output-on-failure
# Core-backed palette/PLI and real-format suites are opt-in; see the test README.
