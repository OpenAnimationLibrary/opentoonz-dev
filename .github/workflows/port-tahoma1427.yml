name: Apply Tahoma2D PR 1427 Port

on:
  push:
    branches:
      - agent/port-tahoma2d-1427-frame-range
    paths:
      - .github/workflows/port-tahoma1427.yml

permissions:
  contents: write

jobs:
  apply-port:
    runs-on: ubuntu-latest
    steps:
      - name: Check out port branch
        uses: actions/checkout@v4
        with:
          ref: agent/port-tahoma2d-1427-frame-range
          fetch-depth: 0

      - name: Apply reconciled eraser phase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base64 --decode > /tmp/tahoma1427.patch.gz <<'PATCH'
          
          PATCH
          gzip --decompress /tmp/tahoma1427.patch.gz

          test "$(sha256sum /tmp/tahoma1427.patch | cut -d' ' -f1)" = \
            "97db8d5bacf24addb9bfd057d15d607c572d6fb1cc0302725b8ea2b20d966385"

          git apply --check /tmp/tahoma1427.patch
          git apply --index /tmp/tahoma1427.patch
          git diff --cached --check

          test "$(git diff --cached --name-only | wc -l)" -eq 6
          grep -q 'm_multi.setItemUIName(L"Off", tr("Off"))' \
            toonz/sources/tnztools/vectorerasertool.cpp
          grep -q 'TInbetween::interpolation(t, algorithm)' \
            toonz/sources/tnztools/fullcolorerasertool.cpp
          grep -q 'TInbetween::interpolation(t, algorithm)' \
            toonz/sources/tnztools/rastererasertool.cpp

          git rm .github/workflows/port-tahoma1427.yml
          git commit -m "Port Tahoma2D frame range interpolation to eraser tools"
          git push origin HEAD:agent/port-tahoma2d-1427-frame-range
