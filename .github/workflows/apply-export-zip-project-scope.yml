name: Apply ZIP project export update

on:
  push:
    branches:
      - export-scene-zip-option
    paths:
      - .github/workflows/apply-export-zip-project-scope.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: export-scene-zip-option
          fetch-depth: 0

      - name: Extend ZIP option to new project export
        shell: python
        run: |
          from pathlib import Path

          path = Path("toonz/sources/toonz/exportscenepopup.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one {label} match, found {count}"
                  )
              text = text.replace(old, new, 1)

          replace_once(
              'QObject::tr("The exported scene folder does not exist.")',
              'QObject::tr("The exported folder does not exist.")',
              "folder error text",
          )

          old_zip_ui = (
              '  m_createZipCheckBox =\n'
              '      new QCheckBox(tr("Create ZIP archive of exported scene folder"),\n'
              '                    lonelyProjectWidget);\n'
              '  m_createZipCheckBox->setToolTip(\n'
              '      tr("Create a ZIP archive after export while keeping the exported folder."));\n'
              '  lonelyProjectLayout->addWidget(m_createZipCheckBox, 2, 1);\n\n'
              '  lonelyProjectWidget->setLayout(lonelyProjectLayout);\n'
              '  layout->addWidget(lonelyProjectWidget);\n'
          )
          new_zip_ui = (
              '  lonelyProjectWidget->setLayout(lonelyProjectLayout);\n'
              '  layout->addWidget(lonelyProjectWidget);\n\n'
              '  m_createZipCheckBox =\n'
              '      new QCheckBox(tr("Create ZIP archive of exported folder"), this);\n'
              '  m_createZipCheckBox->setToolTip(\n'
              '      tr("Create a ZIP archive after exporting a new project or "\n'
              '         "standalone scene while keeping the exported folder."));\n'
              '  layout->addWidget(m_createZipCheckBox);\n'
          )
          replace_once(old_zip_ui, new_zip_ui, "ZIP checkbox UI")

          replace_once(
              '  m_mode = id;\n  // m_projectTreeView->setEnabled(true);',
              '  m_mode = id;\n'
              '  m_createZipCheckBox->setEnabled(id != 0);\n'
              '  // m_projectTreeView->setEnabled(true);',
              "mode switch",
          )

          archive_anchor = (
              '  progressBar.hide();\n'
              '  pm->setCurrentProjectPath(oldProjectPath);\n\n'
              '  QApplication::restoreOverrideCursor();\n'
          )
          archive_replacement = (
              '  progressBar.hide();\n'
              '  pm->setCurrentProjectPath(oldProjectPath);\n\n'
              '  if (success && m_mode == 1 && m_createZipCheckBox->isChecked()) {\n'
              '    TFilePath projectFolder = projectPath.getParentDir();\n'
              '    TFilePath archivePath(projectFolder.getWideString() + L".zip");\n'
              '    QString zipError;\n'
              '    if (!zipDirectory(projectFolder, archivePath, zipError)) {\n'
              '      DVGui::warning(\n'
              '          tr("The project was exported, but the ZIP archive could not be "\n'
              '             "created.\\n%1")\n'
              '              .arg(zipError));\n'
              '      success = false;\n'
              '    }\n'
              '  }\n\n'
              '  QApplication::restoreOverrideCursor();\n'
          )
          replace_once(archive_anchor, archive_replacement, "project ZIP insertion")

          path.write_text(text, encoding="utf-8")

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'new QCheckBox(tr("Create ZIP archive of exported folder"), this);' \
            toonz/sources/toonz/exportscenepopup.cpp
          grep -F 'm_createZipCheckBox->setEnabled(id != 0);' \
            toonz/sources/toonz/exportscenepopup.cpp
          grep -F 'if (success && m_mode == 1 && m_createZipCheckBox->isChecked())' \
            toonz/sources/toonz/exportscenepopup.cpp
          grep -F 'TFilePath projectFolder = projectPath.getParentDir();' \
            toonz/sources/toonz/exportscenepopup.cpp

      - name: Commit and push update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toonz/sources/toonz/exportscenepopup.cpp
          git commit -m "Extend ZIP option to new project export"
          git push origin HEAD:export-scene-zip-option
