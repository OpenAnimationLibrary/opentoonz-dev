name: Apply ZIP project export update

on:
  push:
    branches:
      - export-scene-zip-option
    paths:
      - .github/workflows/apply-export-zip-project-scope.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: export-scene-zip-option
          fetch-depth: 0

      - name: Extend ZIP option to new project export
        shell: python
        run: |
          from pathlib import Path

          path = Path("toonz/sources/toonz/exportscenepopup.cpp")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''  if (!sourceDir.exists()) {
            errorMessage = QObject::tr("The exported scene folder does not exist.");
            return false;
          }
          ''',
                  '''  if (!sourceDir.exists()) {
            errorMessage = QObject::tr("The exported folder does not exist.");
            return false;
          }
          ''',
              ),
              (
                  '''  m_createZipCheckBox =
              new QCheckBox(tr("Create ZIP archive of exported scene folder"),
                            lonelyProjectWidget);
          m_createZipCheckBox->setToolTip(
              tr("Create a ZIP archive after export while keeping the exported folder."));
          lonelyProjectLayout->addWidget(m_createZipCheckBox, 2, 1);

          lonelyProjectWidget->setLayout(lonelyProjectLayout);
          layout->addWidget(lonelyProjectWidget);
          ''',
                  '''  lonelyProjectWidget->setLayout(lonelyProjectLayout);
          layout->addWidget(lonelyProjectWidget);

          m_createZipCheckBox =
              new QCheckBox(tr("Create ZIP archive of exported folder"), this);
          m_createZipCheckBox->setToolTip(
              tr("Create a ZIP archive after exporting a new project or "
                 "standalone scene while keeping the exported folder."));
          layout->addWidget(m_createZipCheckBox);
          ''',
              ),
              (
                  '''void ExportScenePopup::switchMode(int id) {
            assert(id < 3);
            m_mode = id;
            // m_projectTreeView->setEnabled(true);
          }
          ''',
                  '''void ExportScenePopup::switchMode(int id) {
            assert(id < 3);
            m_mode = id;
            m_createZipCheckBox->setEnabled(id != 0);
            // m_projectTreeView->setEnabled(true);
          }
          ''',
              ),
              (
                  '''  progressBar.hide();
            pm->setCurrentProjectPath(oldProjectPath);

            QApplication::restoreOverrideCursor();
          ''',
                  '''  progressBar.hide();
            pm->setCurrentProjectPath(oldProjectPath);

            if (success && m_mode == 1 && m_createZipCheckBox->isChecked()) {
              TFilePath projectFolder = projectPath.getParentDir();
              TFilePath archivePath(projectFolder.getWideString() + L".zip");
              QString zipError;
              if (!zipDirectory(projectFolder, archivePath, zipError)) {
                DVGui::warning(
                    tr("The project was exported, but the ZIP archive could not be "
                       "created.\\n%1")
                        .arg(zipError));
                success = false;
              }
            }

            QApplication::restoreOverrideCursor();
          ''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one match, found {count}: {old.splitlines()[0]}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'new QCheckBox(tr("Create ZIP archive of exported folder"), this);' \
            toonz/sources/toonz/exportscenepopup.cpp
          grep -F 'm_createZipCheckBox->setEnabled(id != 0);' \
            toonz/sources/toonz/exportscenepopup.cpp
          grep -F 'if (success && m_mode == 1 && m_createZipCheckBox->isChecked())' \
            toonz/sources/toonz/exportscenepopup.cpp

      - name: Commit and push update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toonz/sources/toonz/exportscenepopup.cpp
          git commit -m "Extend ZIP option to new project export"
          git push origin HEAD:export-scene-zip-option
