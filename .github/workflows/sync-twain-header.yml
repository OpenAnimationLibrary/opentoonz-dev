name: Sync TWAIN header (temporary)

on:
  push:
    branches:
      - exploratory/restore-twain-scanning
    paths:
      - .github/workflows/sync-twain-header.yml

permissions:
  contents: write

jobs:
  sync-header:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exploratory branch
        uses: actions/checkout@v4
        with:
          ref: exploratory/restore-twain-scanning

      - name: Fetch official TWAIN 2.5 header
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/twain/twain-dsm/refs/heads/master/TWAIN_DSM/src/twain.h \
            --output toonz/sources/common/twain/twain.h
          grep -Eq '^#define[[:space:]]+TWON_PROTOCOLMAJOR[[:space:]]+2' toonz/sources/common/twain/twain.h
          grep -Eq '^#define[[:space:]]+TWON_PROTOCOLMINOR[[:space:]]+5' toonz/sources/common/twain/twain.h

      - name: Commit synchronized header
        shell: bash
        run: |
          if git diff --quiet -- toonz/sources/common/twain/twain.h; then
            echo "TWAIN header already matches the upstream source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toonz/sources/common/twain/twain.h
          git commit -m "twain: update bundled header to TWAIN 2.5"
          git push origin HEAD:exploratory/restore-twain-scanning
