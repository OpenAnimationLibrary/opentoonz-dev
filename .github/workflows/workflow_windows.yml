name: CI

# Keep only the newest run for each pull request. Main-branch runs are not
# cancelled so that every merged commit can still produce its artifacts.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      # Re-include this file so CI changes test themselves.
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      # Re-include this file so CI changes test themselves.
      - '.github/workflows/ci.yml'

jobs:
  # Primary supported build. Later jobs are skipped if this fails.
  Windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # Qt related variable
      QT_PATH: ${{ github.workspace }}\thirdparty\qt\5.15.2_wintab\msvc2019_64

      # Visual Studio related variables
      MSVCVERSION: "Visual Studio 18 2026"

      # Boost-related variables
      BOOST_TOOLSET: "14.3"
      BOOST_VERSION: "1.87.0"
      BOOST_ROOT: C:\local\boost_1_87_0

      # OpenCV-related variables
      OPENCV_VERSION: "4.13.0"
      OpenCV_DIR: C:\tools\opencv\build

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Cache OpenCV and Boost
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            C:\tools\opencv
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-${{ env.BOOST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-

      - name: Install OpenCV and Boost if cache is missing
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          @echo on
          choco install opencv --version=${{ env.OPENCV_VERSION }} -y
          choco install boost-msvc-${{ env.BOOST_TOOLSET }} --version=${{ env.BOOST_VERSION }} -y
        shell: cmd

      - name: Install custom Qt 5.15.2 with WinTab support
        run: |
          @echo on
          mkdir thirdparty\qt
          curl -fsSL -o Qt5.15.2_wintab.zip https://github.com/shun-iwasawa/qt5/releases/download/v5.15.2_wintab/Qt5.15.2_wintab.zip
          7z x Qt5.15.2_wintab.zip
          move Qt5.15.2_wintab\5.15.2_wintab thirdparty\qt
        shell: cmd

      - name: Install third-party prebuilt libs (LFS workaround)
        run: |
          @echo on
          curl -fsSL -o thirdparty-libs.zip https://github.com/andeon/opentoonz-thirdparty-libs/releases/download/prebuilt-libs-v1/thirdparty-libs.zip
          7z x -y thirdparty-libs.zip
        shell: cmd

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: CMake configuration
        run: |
          @echo on
          cd thirdparty
          copy /Y tiff-4.0.3\libtiff\tif_config.vc.h tiff-4.0.3\libtiff\tif_config.h
          copy /Y tiff-4.0.3\libtiff\tiffconf.vc.h tiff-4.0.3\libtiff\tiffconf.h
          copy /Y libpng-1.6.21\scripts\pnglibconf.h.prebuilt libpng-1.6.21\pnglibconf.h

          cd ../toonz
          rmdir /S /Q build
          mkdir build
          cd build

          cmake ..\sources -G "%MSVCVERSION%" -Ax64 -DQT_PATH="%QT_PATH%" -DBOOST_ROOT="%BOOST_ROOT%" -DOpenCV_DIR="%OpenCV_DIR%" -DWITH_WINTAB=Y
        shell: cmd

      - name: Build OpenToonz
        run: |
          @echo on
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal ALL_BUILD.vcxproj
        shell: cmd

      - name: Create Package
        run: |
          @echo on
          cd toonz\build

          mkdir Opentoonz
          copy /Y RelWithDebInfo\*.* Opentoonz\
          copy /Y ..\..\thirdparty\glut\3.7.6\lib\glut64.dll Opentoonz
          copy /Y ..\..\thirdparty\glew\glew-1.9.0\bin\64bit\glew32.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libiconv-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libintl-8.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libjson-c-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libmypaint-1-4-0.dll Opentoonz

          copy /Y "C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll" Opentoonz

          "%QT_PATH%\bin\windeployqt.exe" Opentoonz\Opentoonz.exe --opengl

          del /Q Opentoonz\*.pdb
          del /Q Opentoonz\vc_redist.x64.exe

          mkdir Opentoonz\portablestuff
          xcopy /Y /E /I ..\..\stuff .\Opentoonz\portablestuff
        shell: cmd

      - name: Create Artifact
        run: |
          mkdir artifact
          xcopy toonz\build\Opentoonz artifact\ /E /H /Y
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: artifact

  # Cross-compiler portability gate. The matrix must pass before Fedora or
  # macOS is started. Only GCC packages an AppImage; Clang remains a full
  # compile check without duplicating the release-style packaging work.
  Ubuntu:
    needs: Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v6

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build ccache libboost-all-dev qtbase5-dev qt5-qmake qtscript5-dev qttools5-dev qttools5-dev-tools qtmultimedia5-dev qtwayland5 libqt5svg5-dev libqt5opengl5-dev libqt5multimedia5-plugins libqt5serialport5-dev libsuperlu-dev liblz4-dev libusb-1.0-0-dev liblzo2-dev libpng-dev libjpeg-dev libglew-dev freeglut3-dev libfreetype6-dev libjson-c-dev libmypaint-dev libopencv-dev libturbojpeg-dev libomp-dev libfuse2

      - name: Set up cache
        run: mkdir -p /home/runner/.ccache

      - uses: actions/cache@v5
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-
            ${{ runner.os }}-

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-jbig
          make -j $(nproc)

      - name: Build
        run: |
          export CCACHE_DIR=/home/runner/.ccache
          export CC="ccache ${{ matrix.cc }}"
          export CXX="ccache ${{ matrix.cxx }}"
          cd toonz
          mkdir build
          cd build
          cmake ../sources -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DWITH_TRANSLATION=OFF
          ninja

      - name: Create Artifact
        if: matrix.compiler == 'gcc'
        run: |
          cd toonz/build
          sudo ninja install

          mkdir -p appdir/usr
          cp -r /opt/opentoonz/* appdir/usr
          cp appdir/usr/share/applications/*.desktop appdir
          cp appdir/usr/share/icons/hicolor/*/apps/*.png appdir

          mkdir artifact
          mv appdir/usr/share/opentoonz/stuff artifact/portablestuff
          rmdir appdir/usr/share/opentoonz

          wget -q -c 'https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage'
          wget -q -c 'https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage'
          wget -q -c 'https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage'
          chmod 755 linuxdeploy-x86_64.AppImage
          chmod 755 linuxdeploy-plugin-qt-x86_64.AppImage
          chmod 755 linuxdeploy-plugin-appimage-x86_64.AppImage

          cat << EOF_APP_RUN > apprun.sh
          #!/usr/bin/env bash
          exec "\${APPDIR}/usr/bin/OpenToonz"
          EOF_APP_RUN
          chmod 755 apprun.sh

          export LD_LIBRARY_PATH='appdir/usr/lib/opentoonz'
          export LDAI_NO_APPSTREAM=1
          ./linuxdeploy-x86_64.AppImage --appdir=appdir --plugin=qt --output=appimage --custom-apprun=apprun.sh \
          --executable=appdir/usr/bin/lzocompress \
          --executable=appdir/usr/bin/lzodecompress \
          --executable=appdir/usr/bin/tcleanup \
          --executable=appdir/usr/bin/tcomposer \
          --executable=appdir/usr/bin/tconverter \
          --executable=appdir/usr/bin/tfarmcontroller \
          --executable=appdir/usr/bin/tfarmserver
          mv OpenToonz*.AppImage artifact/OpenToonz.AppImage
          ARTIFACT_NAME=Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
          mv artifact ${ARTIFACT_NAME}
          tar zcf ${ARTIFACT_NAME}.tar.gz ${ARTIFACT_NAME}

      - name: Upload Artifact
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v6
        with:
          name: Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
          path: toonz/build/Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}.tar.gz

  # Compile-only Fedora coverage taken from upstream OpenToonz PR #6986.
  # It runs after the core Ubuntu matrix but does not delay macOS.
  Fedora:
    needs: Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites
        # actions/checkout needs git and tar, absent from the base image.
        run: dnf install -y git tar gzip

      - uses: actions/checkout@v6

      - name: Install libraries
        run: |
          dnf install -y gcc gcc-c++ automake libtool make git cmake ninja-build \
            boost boost-devel SuperLU SuperLU-devel lz4-devel xz-devel \
            libusb1-devel lzo-devel libjpeg-turbo-devel turbojpeg-devel \
            glew glew-devel freeglut freeglut-devel freetype-devel libpng-devel \
            blas blas-devel json-c-devel opencv-devel libmypaint-devel \
            qt5-qtbase-devel qt5-qtsvg qt5-qtsvg-devel qt5-qtscript qt5-qtscript-devel \
            qt5-qttools qt5-qttools-devel qt5-qttools-static qt5-qtmultimedia \
            qt5-qtmultimedia-devel qt5-qtserialport-devel qt5-qtwayland \
            pkgconf-pkg-config

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-jbig
          make -j $(nproc)

      - name: Build
        run: |
          cd toonz
          mkdir build
          cd build
          cmake ../sources -G Ninja -DWITH_TRANSLATION=OFF
          ninja

  # Final cross-platform hardening build. Fedora and macOS run in parallel
  # after the Ubuntu matrix passes.
  macOS:
    needs: Ubuntu
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Clean Python symlinks
        run: |
          find /usr/local/bin -type l \( -name "python*" -o -name "pip*" -o -name "2to3*" -o -name "idle*" -o -name "pydoc*" \) \
            -exec sh -c 'file -b {} | grep -q "symbolic link to .*Python.framework" && echo "Removing {}" && rm {}' \;
          for py_version in python@3.11 python@3.12 python@3.13 python@3.14; do
            if brew list --versions $py_version >/dev/null; then
              brew unlink $py_version || true
            fi
          done
          brew link --overwrite --force python@3.14 || true

      - name: Install libraries
        run: |
          checkPkgAndInstall() {
            for pkg in "$@"; do
              if brew ls --versions "$pkg" >/dev/null; then
                echo "$pkg already installed"
              else
                brew install "$pkg"
              fi
            done
          }

          brew update

          checkPkgAndInstall pkg-config glew lz4 libjpeg libpng lzo boost libusb libmypaint ccache jpeg-turbo ninja opencv@4 openjph openexr

          brew list --formula | grep '^qt' | grep -v '@5' | xargs -n1 brew unlink || true

          brew install qt@5
          brew unlink qt@5 || true
          brew link qt@5 || true

      - name: Set up cache
        run: |
          export PATH="/usr/local/opt/ccache/libexec:$PATH"
          mkdir -p /Users/runner/.ccache

      - uses: actions/cache@v5
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-lzma
          make -j $(sysctl -n hw.ncpu)
          make install

      - name: Build
        run: |
          export PKG_CONFIG_PATH="/usr/local/opt/jpeg-turbo/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd toonz
          rm -rf build
          mkdir -p build
          cd build
          cmake ../sources -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DQT_PATH=$(brew --prefix qt@5)/lib \
            -DQt5_DIR=$(brew --prefix qt@5)/lib/cmake/Qt5 \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5)/lib/cmake/Qt5 \
            -DOpenCV_DIR=$(brew --prefix opencv@4)/lib/cmake/opencv4 \
            -DWITH_TRANSLATION=OFF
          ninja -j $(sysctl -n hw.ncpu)

      - name: Introduce Libraries and Stuff
        run: |
          cd toonz/build/toonz
          cp -pr ../../../stuff OpenToonz.app/portablestuff
          /usr/local/opt/qt@5/bin/macdeployqt OpenToonz.app -verbose=0 -always-overwrite \
            -executable=OpenToonz.app/Contents/MacOS/lzocompress \
            -executable=OpenToonz.app/Contents/MacOS/lzodecompress \
            -executable=OpenToonz.app/Contents/MacOS/tcleanup \
            -executable=OpenToonz.app/Contents/MacOS/tcomposer \
            -executable=OpenToonz.app/Contents/MacOS/tconverter \
            -executable=OpenToonz.app/Contents/MacOS/tfarmcontroller \
            -executable=OpenToonz.app/Contents/MacOS/tfarmserver

      - name: Modify Library Paths
        run: |
          cd toonz/build/toonz/OpenToonz.app/Contents/Frameworks
          for TARGETLIB in *.dylib; do
            otool -L "$TARGETLIB" | grep ".dylib" | grep -v "$TARGETLIB" | grep -v "@executable_path/../Frameworks" | awk '{print $1}' | while read -r FROMPATH; do
              LIBNAME=$(basename "$FROMPATH")
              if [[ -e ./$LIBNAME ]]; then
                install_name_tool -change "$FROMPATH" "@executable_path/../Frameworks/$LIBNAME" "$TARGETLIB"
              fi
            done
          done

      - name: Create Artifact
        run: |
          cd toonz/build/toonz
          echo "Creating DMG..."
          ATTEMPT=1
          until /usr/local/opt/qt@5/bin/macdeployqt OpenToonz.app -dmg -verbose=0 && [ -f OpenToonz.dmg ]; do
            echo "Attempt $ATTEMPT failed to build DMG."
            if [ $ATTEMPT -eq 10 ]; then
              echo ">>> DMG file creation failed after 10 attempts. Aborting!"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Retrying in 5 seconds..."
            sleep 5
          done
          echo "DMG created successfully."

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
