name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      record_session:
        description: 'Record the OpenToonz CI session when a GUI test launches it'
        required: false
        type: boolean
        default: true
      upload_recording:
        description: 'Upload the CI session recording artifact'
        required: false
        type: boolean
        default: true
      recording_fps:
        description: 'Recorder frame rate'
        required: false
        default: '12'
      recording_bitrate:
        description: 'Recorder video bitrate'
        required: false
        default: '2M'
      recording_scale:
        description: 'Recorder output scale (empty keeps desktop size)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recorder-encoder:
    name: RecorderEncoder
    runs-on: windows-2022
    env:
      MSYS2_PATH_TYPE: inherit
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/cache@v5
        id: recorder-encoder-cache
        with:
          path: recorder-encoder
          key: ot-dev-recorder-encoder-${{ runner.os }}-${{ hashFiles('.github/ot-dev/recorder/ffmpeg-encoder-version.txt') }}

      - uses: msys2/setup-msys2@v2
        if: steps.recorder-encoder-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            make
            diffutils
            tar
            xz

      - name: Build input-restricted recorder encoder
        if: steps.recorder-encoder-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          version="$(tr -d '\r\n' < .github/ot-dev/recorder/ffmpeg-encoder-version.txt)"
          curl.exe -fL --retry 3 -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${version}.tar.xz"
          tar -xf ffmpeg.tar.xz
          cd "ffmpeg-${version}"
          ./configure \
            --prefix="$PWD/../recorder-encoder" \
            --disable-doc --disable-debug --disable-everything \
            --enable-ffmpeg --enable-ffprobe \
            --enable-avdevice --enable-avfilter --enable-swscale \
            --enable-indev=gdigrab \
            --enable-protocol=file \
            --enable-filter=scale \
            --enable-encoder=mpeg4 \
            --enable-decoder=mpeg4 \
            --enable-parser=mpeg4video \
            --enable-muxer=matroska \
            --enable-demuxer=matroska
          make -j2
          make install
          cp COPYING.LGPLv2.1 ../recorder-encoder/
          cp COPYING.LGPLv3 ../recorder-encoder/
          cp ../.github/ot-dev/recorder/ffmpeg-encoder-version.txt ../recorder-encoder/
          printf '%s\n' \
            '--disable-doc --disable-debug --disable-everything' \
            '--enable-ffmpeg --enable-ffprobe --enable-avdevice --enable-avfilter --enable-swscale' \
            '--enable-indev=gdigrab --enable-protocol=file --enable-filter=scale' \
            '--enable-encoder=mpeg4 --enable-decoder=mpeg4 --enable-parser=mpeg4video' \
            '--enable-muxer=matroska --enable-demuxer=matroska' \
            > ../recorder-encoder/configure-flags.txt

      - name: Run actions/upload-artifact@v6
        uses: actions/upload-artifact@v6
        with:
          name: ot-dev-recorder-encoder
          path: recorder-encoder
          retention-days: 30

      - name: Run actions/upload-artifact@v6
        uses: actions/upload-artifact@v6
        with:
          name: ot-dev-recorder-encoder-sources
          path: |
            .github/ot-dev/recorder/ffmpeg-encoder-version.txt
            .github/ot-dev/recorder/README.md
          retention-days: 30

  windows:
    name: Windows
    needs: recorder-encoder
    runs-on: windows-2022
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
      OpenCV_DIR: C:\tools\opencv\build
      QT_PATH: C:\Qt\5.15.2\msvc2019_64
      MSVCVERSION: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: Inject OT-Dev recorder (Windows CI only)
        shell: pwsh
        env:
          OTDEV_RECORD_SESSION: ${{ github.event_name != 'workflow_dispatch' || inputs.record_session }}
          OTDEV_UPLOAD_RECORDING: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_recording }}
          OTDEV_RECORD_FPS: ${{ github.event_name == 'workflow_dispatch' && inputs.recording_fps || '12' }}
          OTDEV_RECORD_BITRATE: ${{ github.event_name == 'workflow_dispatch' && inputs.recording_bitrate || '2M' }}
          OTDEV_RECORD_SCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.recording_scale || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/ot-dev/recorder/inject_recorder.py `
            --source-root toonz/sources `
            --metadata-out "$env:RUNNER_TEMP\ot-dev-recorder.json" `
            --consent on `
            --record $(if ($env:OTDEV_RECORD_SESSION -eq 'true') { 'on' } else { 'off' }) `
            --upload $(if ($env:OTDEV_UPLOAD_RECORDING -eq 'true') { 'on' } else { 'off' }) `
            --fps "$env:OTDEV_RECORD_FPS" `
            --bitrate "$env:OTDEV_RECORD_BITRATE" `
            --scale "$env:OTDEV_RECORD_SCALE"
          if ($LASTEXITCODE) { throw 'Recorder injection failed' }

      - uses: actions/download-artifact@v6
        with:
          name: ot-dev-recorder-encoder
          path: recorder-encoder

      - uses: actions/download-artifact@v6
        with:
          name: ffmpeg-windows-test-decoder
          path: recorder-test-decoder
        continue-on-error: true

      - name: Brand OT-Dev build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content "$env:RUNNER_TEMP\ot-dev-recorder.json" | ConvertFrom-Json
          $sha = '${{ github.sha }}'
          $shortSha = $sha.Substring(0, [Math]::Min(8, $sha.Length))
          $recording = if ($manifest.recording_enabled) { 'recording on' } else { 'recording off' }
          $buildId = "OT-Dev $shortSha | Windows CI | $recording"
          Set-Content -LiteralPath "$env:RUNNER_TEMP\ot-dev-build-id.txt" -Value $buildId -Encoding UTF8
          $splash = @"
          <svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
            <rect width="960" height="540" fill="#20242a"/>
            <text x="60" y="220" fill="#f2f5f7" font-family="Segoe UI,Arial,sans-serif" font-size="74" font-weight="600">OpenToonz</text>
            <text x="64" y="285" fill="#69c7ff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="600">OT-DEV DIAGNOSTIC BUILD</text>
            <text x="64" y="340" fill="#c9d1d9" font-family="Consolas,monospace" font-size="22">$shortSha</text>
            <text x="64" y="378" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="20">Windows CI | $recording</text>
          </svg>
          "@
          Set-Content -LiteralPath "$env:RUNNER_TEMP\ot-dev-splash.svg" -Value $splash -Encoding UTF8

      - name: Cache OpenCV and Boost
        uses: actions/cache@v5
        id: deps-cache
        with:
          path: |
            C:\tools\opencv
            C:\local\boost_1_87_0
          key: ot-win-deps-opencv4130-boost1870

      - name: Install OpenCV and Boost if cache is missing
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          choco install opencv --version=4.13.0 -y
          choco install boost-msvc-14.3 --version=1.87.0 -y

      - name: Install custom Qt 5.15.2 with WinTab support
        shell: cmd
        run: |
          call ci-scripts\win\qt_install.bat

      - name: Install third-party prebuilt libs (LFS workaround)
        shell: cmd
        run: |
          call ci-scripts\win\install_thirdparty.bat

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Test recorder consent, capture, and native Windows playback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s .github/ot-dev/recorder -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Recorder injection tests failed' }
          cmake -S .github/ot-dev/recorder -B recorder-tests -G "$env:MSVCVERSION" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_PATH"
          if ($LASTEXITCODE) { throw 'Recorder test configure failed' }
          cmake --build recorder-tests --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Recorder test build failed' }
          $env:PATH = "$env:QT_PATH\bin;$env:PATH"
          $env:OTDEV_TEST_FFMPEG = "$env:GITHUB_WORKSPACE\recorder-encoder\ffmpeg.exe"
          $env:OTDEV_TEST_DECODER = "$env:GITHUB_WORKSPACE\recorder-test-decoder\ffmpeg.exe"
          ctest --test-dir recorder-tests -C Release --output-on-failure
          $recorderTestExit = $LASTEXITCODE
          Get-ChildItem recorder-tests/recorder-*.txt | ForEach-Object { Get-Content $_.FullName }
          if ($recorderTestExit) { throw 'Recorder tests failed' }

      # CMake configuration step
      - name: CMake configuration
        run: |
          @echo on
          cd thirdparty
          copy /Y tiff-4.0.3\libtiff\tif_config.vc.h tiff-4.0.3\libtiff\tif_config.h
          copy /Y tiff-4.0.3\libtiff\tiffconf.vc.h tiff-4.0.3\libtiff\tiffconf.h
          copy /Y libpng-1.6.21\scripts\pnglibconf.h.prebuilt libpng-1.6.21\pnglibconf.h

          cd ../toonz
          rmdir /S /Q build
          mkdir build
          cd build

          cmake ..\sources -G "%MSVCVERSION%" -Ax64 -DQT_PATH="%QT_PATH%" -DBOOST_ROOT="%BOOST_ROOT%" -DOpenCV_DIR="%OpenCV_DIR%" -DWITH_WINTAB=Y -DBUILD_LUT3D_TESTS=ON -DBUILD_GLB_FX_TESTS=ON
        shell: cmd

      # Run the focused regression before the longer application build.
      - name: Build and test 3D LUT Bake
        shell: cmd
        run: |
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal stdfx\lut3dbake_test.vcxproj
          if %errorlevel% neq 0 exit /b %errorlevel%
          set "PATH=%QT_PATH%\bin;%GITHUB_WORKSPACE%\thirdparty\glut\3.7.6\lib;%GITHUB_WORKSPACE%\thirdparty\glew\glew-1.9.0\bin\64bit;%GITHUB_WORKSPACE%\thirdparty\libmypaint\dist\64;C:\tools\opencv\build\x64\vc16\bin;%PATH%"
          RelWithDebInfo\lut3dbake_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%

      - name: Build and test GLB 3D FX rendering
        shell: cmd
        run: |
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal stdfx\glbmodelfx_test.vcxproj stdfx\threepointlightfx_test.vcxproj
          if %errorlevel% neq 0 exit /b %errorlevel%
          set "PATH=%QT_PATH%\bin;%GITHUB_WORKSPACE%\thirdparty\glut\3.7.6\lib;%GITHUB_WORKSPACE%\thirdparty\glew\glew-1.9.0\bin\64bit;%GITHUB_WORKSPACE%\thirdparty\libmypaint\dist\64;C:\tools\opencv\build\x64\vc16\bin;%PATH%"
          RelWithDebInfo\glbmodelfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          RelWithDebInfo\threepointlightfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%

      # Build Opentoonz using MSBuild
      - name: Build Opentoonz
        run: |
          @echo on
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal ALL_BUILD.vcxproj
        shell: cmd

      # Create the package
      - name: Create Package
        run: |
          @echo on
          cd toonz\build
          
          REM Create Opentoonz directory and copy files from RelWithDebInfo
          mkdir Opentoonz
          copy /Y RelWithDebInfo\*.* Opentoonz\
          REM Copy required DLLs for proper functionality
          copy /Y ..\..\thirdparty\glut\3.7.6\lib\glut64.dll Opentoonz
          copy /Y ..\..\thirdparty\glew\glew-1.9.0\bin\64bit\glew32.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libiconv-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libintl-8.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libjson-c-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libmypaint-1-4-0.dll Opentoonz
          
          REM Copy OpenCV DLL (IMPORTANT: Update path/filename when upgrading OpenCV version)
          copy /Y "C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll" Opentoonz
          
          REM Deploy Qt dependencies
          "%QT_PATH%\bin\windeployqt.exe" Opentoonz\Opentoonz.exe --opengl

          REM Add generated OT-Dev-only build manifest/artwork beside OpenToonz.exe
          copy /Y "%RUNNER_TEMP%\ot-dev-splash.svg" Opentoonz\splash.svg

          del /Q Opentoonz\*.pdb  REM Remove .pdb files
          del /Q Opentoonz\vc_redist.x64.exe REM Remove vc_redist.x64.exe file
          
          REM Create portablestuff directory and copy stuff folder
          mkdir Opentoonz\portablestuff
          xcopy /Y /E /I ..\..\stuff .\Opentoonz\portablestuff
        shell: cmd

      - name: Test 3D LUT Bake
        shell: cmd
        run: |
          cd toonz\build\Opentoonz
          lut3dbake_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          del lut3dbake_test.exe

      - name: Test packaged GLB 3D FX rendering
        shell: cmd
        run: |
          cd toonz\build\Opentoonz
          glbmodelfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          threepointlightfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          del glbmodelfx_test.exe
          del threepointlightfx_test.exe

      - name: Package OT-Dev recorder and matching FFmpeg sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'toonz/build/Opentoonz/otdev-recorder'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item recorder-encoder/* $destination -Recurse
          Copy-Item .github/ot-dev/recorder/README.md $destination
          & "$destination/ffmpeg.exe" -version
          if ($LASTEXITCODE) { throw 'Packaged recorder encoder does not launch' }

      # Create Artifact from build
      - name: Create Artifact
        run: |
          mkdir artifact
          xcopy toonz\build\Opentoonz artifact\ /E /H /Y
        shell: cmd

      - uses: actions/upload-artifact@v6
        with:
          name: OpenToonz-Windows
          path: artifact
          retention-days: 7
