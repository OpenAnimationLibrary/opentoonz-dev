name: Windows Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  push:
    branches:
      - main
    paths:
      - '**/*'                                    # Include all files in the repository
      - '!appveyor.yml'                           # Ignore changes in AppVeyor
      - '!README.md'                              # Exclude README
      - '!doc/**'                                 # Exclude documentation
      - '!**/.github/**'                          # Exclude everything in .github folder
      - '.github/workflows/workflow_windows.yml'  # Include Windows workflow file
  pull_request:
    branches:
      - main
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Windows:
    runs-on: windows-2025
    env:
      # QT related variable
      QT_PATH: ${{ github.workspace }}\thirdparty\qt\5.15.2_wintab\msvc2019_64  # Path to custom Qt

      # Visual Studio related variables
      MSVCVERSION: "Visual Studio 18 2026"  # Visual Studio version
      
      # Boost-related variables      
      BOOST_TOOLSET: "14.3"                 # Boost MSVC Toolset version
      BOOST_VERSION: "1.87.0"               # Boost version
      BOOST_ROOT: C:\local\boost_1_87_0     # Path to Boost library root
      
      # OpenCV-related variables      
      OPENCV_VERSION: "4.13.0"              # OpenCV version
      OpenCV_DIR: C:\tools\opencv\build     # Path to OpenCV

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      # Cache OpenCV and Boost libraries
      - name: Cache OpenCV and Boost
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            C:\tools\opencv
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-${{ env.BOOST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-

      # Install OpenCV and Boost if the cache is missing
      - name: Install OpenCV and Boost if cache is missing
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          @echo on
          choco install opencv --version=${{ env.OPENCV_VERSION }} -y
          choco install boost-msvc-${{ env.BOOST_TOOLSET }} --version=${{ env.BOOST_VERSION }} -y
        shell: cmd

      # Install custom Qt 5.15.2 with WinTab support
      - name: Install custom Qt 5.15.2 with WinTab support
        run: |
          @echo on
          mkdir thirdparty\qt
          curl -fsSL -o Qt5.15.2_wintab.zip https://github.com/shun-iwasawa/qt5/releases/download/v5.15.2_wintab/Qt5.15.2_wintab.zip
          7z x Qt5.15.2_wintab.zip
          move Qt5.15.2_wintab\5.15.2_wintab thirdparty\qt
        shell: cmd

      - name: Install third-party prebuilt libs (LFS workaround)
        run: |
          @echo on
          curl -fsSL -o thirdparty-libs.zip https://github.com/andeon/opentoonz-thirdparty-libs/releases/download/prebuilt-libs-v1/thirdparty-libs.zip
          7z x -y thirdparty-libs.zip
        shell: cmd    

      # Add msbuild to PATH for build process
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      # CMake configuration step
      - name: CMake configuration
        run: |
          @echo on
          cd thirdparty
          copy /Y tiff-4.0.3\libtiff\tif_config.vc.h tiff-4.0.3\libtiff\tif_config.h
          copy /Y tiff-4.0.3\libtiff\tiffconf.vc.h tiff-4.0.3\libtiff\tiffconf.h
          copy /Y libpng-1.6.21\scripts\pnglibconf.h.prebuilt libpng-1.6.21\pnglibconf.h

          cd ../toonz
          rmdir /S /Q build
          mkdir build
          cd build

          cmake ..\sources -G "%MSVCVERSION%" -Ax64 -DQT_PATH="%QT_PATH%" -DBOOST_ROOT="%BOOST_ROOT%" -DOpenCV_DIR="%OpenCV_DIR%" -DWITH_WINTAB=Y -DENABLE_CRASH_REPORTER_TEST=ON
        shell: cmd

      # Build Opentoonz using MSBuild
      - name: Build Opentoonz
        run: |
          @echo on
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal ALL_BUILD.vcxproj
        shell: cmd

      # Create the package
      - name: Create Package
        run: |
          @echo on
          cd toonz\build
          
          REM Create Opentoonz directory and copy files from RelWithDebInfo
          mkdir Opentoonz
          copy /Y RelWithDebInfo\*.* Opentoonz\
          REM Copy required DLLs for proper functionality
          copy /Y ..\..\thirdparty\glut\3.7.6\lib\glut64.dll Opentoonz
          copy /Y ..\..\thirdparty\glew\glew-1.9.0\bin\64bit\glew32.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libiconv-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libintl-8.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libjson-c-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libmypaint-1-4-0.dll Opentoonz
          
          REM Copy OpenCV DLL (IMPORTANT: Update path/filename when upgrading OpenCV version)
          copy /Y "C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll" Opentoonz
          
          REM Deploy Qt dependencies
          "%QT_PATH%\bin\windeployqt.exe" Opentoonz\Opentoonz.exe --opengl

          REM Preserve matching symbols separately from the portable build
          mkdir Symbols
          xcopy /Y /E /I RelWithDebInfo\*.pdb Symbols
          del /Q Opentoonz\*.pdb
          del /Q Opentoonz\vc_redist.x64.exe REM Remove vc_redist.x64.exe file
          
          REM Create portablestuff directory and copy stuff folder
          mkdir Opentoonz\portablestuff
          xcopy /Y /E /I ..\..\stuff .\Opentoonz\portablestuff
        shell: cmd

      - name: Add diagnostic build information
        shell: pwsh
        run: |
          @"
          OT-Dev Diagnostic Build
          Commit: $env:GITHUB_SHA
          Build date (UTC): $([DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss"))
          Configuration: RelWithDebInfo
          Crash reporter test: Enabled

          This is an unofficial development build for testing work in progress.
          Save work before using Help > Test Crash Reporter.
          "@ | Set-Content toonz\build\Opentoonz\OTDEV_BUILD.txt

      - name: Create diagnostic archives
        shell: pwsh
        run: |
          Compress-Archive -Path toonz\build\Opentoonz -DestinationPath OpenToonz-OTDev-Diagnostic-Windows.zip
          Compress-Archive -Path toonz\build\Symbols -DestinationPath OpenToonz-OTDev-Diagnostic-Symbols-Windows.zip

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OpenToonz-OTDev-Diagnostic-Windows-${{ github.sha }}
          retention-days: 14
          path: |
            OpenToonz-OTDev-Diagnostic-Windows.zip
            OpenToonz-OTDev-Diagnostic-Symbols-Windows.zip

  Publish:
    needs: Windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download diagnostic archives
        uses: actions/download-artifact@v7
        with:
          name: OpenToonz-OTDev-Diagnostic-Windows-${{ github.sha }}
          path: release

      - name: Publish rolling diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Unofficial Windows diagnostic build from OT-Dev main.

            - Configuration: RelWithDebInfo
            - Crash reporter test: Enabled
            - Commit: ${{ github.sha }}
            - Use Help > Test Crash Reporter for a confirmed end-to-end test.
            - Save work before testing.

            The symbols archive matches this exact build and is intended for crash-dump analysis.
        run: |
          git tag --force otdev-diagnostic "$GITHUB_SHA"
          git push origin refs/tags/otdev-diagnostic --force

          if gh release view otdev-diagnostic >/dev/null 2>&1; then
            gh release edit otdev-diagnostic --title "OT-Dev Windows Diagnostic Build" --notes "$RELEASE_NOTES" --prerelease
          else
            gh release create otdev-diagnostic --title "OT-Dev Windows Diagnostic Build" --notes "$RELEASE_NOTES" --prerelease --target "$GITHUB_SHA"
          fi

          gh release upload otdev-diagnostic release/OpenToonz-OTDev-Diagnostic-Windows.zip release/OpenToonz-OTDev-Diagnostic-Symbols-Windows.zip --clobber
