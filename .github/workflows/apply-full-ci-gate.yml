name: Apply Full CI Gate

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/restrict-ci-workflows'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restrict-ci-workflows
          fetch-depth: 0

      - name: Gate Linux and macOS PR builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflows = {
              Path('.github/workflows/workflow_linux.yml'): 'Ubuntu',
              Path('.github/workflows/workflow_macos.yml'): 'macOS',
          }

          old_types = 'types: [opened, synchronize, reopened, ready_for_review]'
          new_types = 'types: [opened, synchronize, reopened, ready_for_review, labeled]'

          for path, job_name in workflows.items():
              text = path.read_text(encoding='utf-8')
              if old_types not in text:
                  raise SystemExit(f'Expected pull_request types not found in {path}')
              text = text.replace(old_types, new_types, 1)

              marker = f'jobs:\n  {job_name}:\n'
              gated = (
                  f'jobs:\n  {job_name}:\n'
                  "    if: >-\n"
                  "      github.event_name != 'pull_request' ||\n"
                  "      contains(github.event.pull_request.labels.*.name, 'full-ci')\n"
              )
              if marker not in text:
                  raise SystemExit(f'Expected job marker not found in {path}')
              text = text.replace(marker, gated, 1)
              path.write_text(text, encoding='utf-8')
          PY

          gh label create full-ci \
            --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 \
            --description "Run deferred Linux and macOS CI" \
            --force

          git rm .github/workflows/apply-full-ci-gate.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/workflow_linux.yml .github/workflows/workflow_macos.yml
          git commit -m "Defer Linux and macOS PR builds until full CI"
          git push origin HEAD:agent/restrict-ci-workflows
