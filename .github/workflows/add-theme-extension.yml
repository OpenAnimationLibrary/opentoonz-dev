name: Add theme extension support

on:
  push:
    branches:
      - add-style-sheet-load-save

permissions:
  contents: write

jobs:
  apply-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-style-sheet-load-save

      - name: Add .theme to style sheet filters
        shell: python
        run: |
          from pathlib import Path

          path = Path("toonz/sources/toonz/preferencespopup.cpp")
          source = path.read_text(encoding="utf-8")
          old = 'tr("Style Sheets (*.qss *.css);;Theme Files (*.qss *.css *.txt);;All Files (*)")'
          new = 'tr("Style Sheets (*.qss *.css *.theme);;Theme Files (*.qss *.css *.theme *.txt);;All Files (*)")'
          count = source.count(old)
          if count != 2:
              raise SystemExit(f"Expected two filter strings, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/add-theme-extension.yml

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toonz/sources/toonz/preferencespopup.cpp .github/workflows/add-theme-extension.yml
          git commit -m "Add .theme support to style sheet file filters"
          git push origin add-style-sheet-load-save
