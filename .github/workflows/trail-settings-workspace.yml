name: Trail Settings Workspace
on:
  push:
    branches: [automation/trail-settings-workspace-20261001]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'OpenAnimationLibrary/opentoonz-dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install syntax-check and formatting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14 qtbase5-dev libqt5opengl5-dev qtmultimedia5-dev libqt5svg5-dev libboost-dev libglew-dev libglu1-mesa-dev freeglut3-dev libmypaint-dev libfreetype6-dev
      - name: Apply, format, validate and publish the isolated feature branch
        run: python3 .github/ot-dev/trail-settings-workspace/prepare.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trail-settings-preflight
          path: |
            /tmp/trail-settings-formatted.patch
            /tmp/trail-settings-head.txt
          if-no-files-found: ignore
          retention-days: 3
