name: Trail Settings Workspace
on:
  push:
    branches: [automation/trail-settings-workspace-20261001]
permissions:
  contents: write
jobs:
  click-stamp:
    if: github.repository == 'OpenAnimationLibrary/opentoonz-dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ syntax dependencies
        run: |
          sudo apt-get -qq update > /tmp/trail-deps.log 2>&1
          sudo apt-get -qq install -y clang-format-14 qtbase5-dev libqt5opengl5-dev qtmultimedia5-dev libqt5svg5-dev libboost-dev libglew-dev libglu1-mesa-dev freeglut3-dev libmypaint-dev libfreetype6-dev >> /tmp/trail-deps.log 2>&1 || { tail -80 /tmp/trail-deps.log; exit 1; }
      - name: Apply, test and publish click-stamping follow-up
        run: python3 .github/ot-dev/trail-settings-workspace/click_stamp.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trail-click-preflight
          path: |
            /tmp/trail-click-formatted.patch
            /tmp/trail-click-head.txt
          if-no-files-found: ignore
          retention-days: 3
