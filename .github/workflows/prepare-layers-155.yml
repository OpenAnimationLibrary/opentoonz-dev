name: Prepare Layers 155 update
on:
  push:
    branches: [maintenance/layers-155-update-20261002]
    paths:
      - .github/ot-dev/apply-layers-update.py
      - .github/workflows/prepare-layers-155.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/drawing-layers-panel
          fetch-depth: 0
          show-progress: false
      - name: Prepare source update without changing the PR branch
        env:
          PREPARATION_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show "$PREPARATION_SHA:.github/ot-dev/apply-layers-update.py" > "$RUNNER_TEMP/apply-layers-update.py"
          if ! git merge --no-edit origin/main; then
            python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          assert conflicts == ['.github/workflows/workflow_windows.yml'], conflicts
          p = Path(conflicts[0])
          text = p.read_text()
          count = [0]
          def resolve(m):
              ours, theirs = m.group(1), m.group(2)
              count[0] += 1
              if 'cmake ..\\sources' in ours:
                  assert '-DWITH_LAYER_TESTS=ON' in ours
                  assert '-DBUILD_EXR_TESTS=ON' in theirs and '-DBUILD_GLB_FX_TESTS=ON' in theirs
                  assert len(ours.splitlines()) == len(theirs.splitlines()) == 1
                  return theirs.rstrip('\n') + ' -DWITH_LAYER_TESTS=ON\n'
              assert 'Test Layers panel and persistent vector group names' in ours
              assert 'Test 3D LUT Bake' in theirs and 'Test packaged 3D FX rendering' in theirs
              return ours + '\n' + theirs
          text = re.sub(r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> origin/main\n', resolve, text, flags=re.M | re.S)
          assert count[0] == 2 and '<<<<<<<' not in text
          p.write_text(text)
          subprocess.run(['git', 'add', str(p)], check=True)
          subprocess.run(['git', 'commit', '-m', 'Merge current OT-Dev main; retain all Windows regression suites'], check=True)
          PY
          fi
          python3 "$RUNNER_TEMP/apply-layers-update.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('toonz/sources/toonz/drawinglayers.cpp')
          text = p.read_text()
          old = '  // Any scene/structure change while a menu is open invalidates its target.\n'
          assert text.count(old) == 1
          text = text.replace(old, old + '''  connect(model(), &QAbstractItemModel::modelAboutToBeReset,
                  &menu, &QMenu::close);
            connect(m_app->getCurrentFrame(), &TFrameHandle::frameSwitched,
                    &menu, &QMenu::close);
            connect(m_app->getCurrentColumn(), &TColumnHandle::columnIndexSwitched,
                    &menu, &QMenu::close);
          ''')
          p.write_text(text)
          PY
          sudo apt-get -qq update > "$RUNNER_TEMP/layers-apt.log" 2>&1
          sudo apt-get -qq install -y clang-format-14 qtbase5-dev libqt5svg5-dev libqt5opengl5-dev libglew-dev freeglut3-dev libboost-dev >> "$RUNNER_TEMP/layers-apt.log" 2>&1 || { tail -100 "$RUNNER_TEMP/layers-apt.log"; exit 1; }
          clang-format-14 -i toonz/sources/toonz/drawinglayers.cpp toonz/sources/toonz/drawinglayers.h toonz/sources/toonz/drawinglayersxsheet.cpp toonz/sources/toonz/xshcellviewer.h .github/ot-dev/layers-tests/layers_test.cpp
          git diff --check
          mkdir -p "$RUNNER_TEMP/layers-check"
          INCLUDES="-I toonz/sources/include -I toonz/sources/toonz -I toonz/sources/toonzqt -I toonz/sources/toonzfarm/include $(pkg-config --cflags Qt5Widgets Qt5OpenGL Qt5Svg Qt5Test)"
          FLAGS="-std=c++17 -fPIC -DTNZ_LITTLE_ENDIAN=1 -DLINUX -D_LINUX -Dx64 $INCLUDES"
          for source in toonz/sources/toonz/drawinglayers.cpp toonz/sources/toonz/drawinglayersxsheet.cpp .github/ot-dev/layers-tests/layers_test.cpp; do
            echo "SYNTAX_CHECK $source"
            g++ $FLAGS -fsyntax-only "$source"
          done
          moc $INCLUDES toonz/sources/toonz/drawinglayers.h -o "$RUNNER_TEMP/layers-check/moc_drawinglayers.cpp"
          g++ $FLAGS -fsyntax-only "$RUNNER_TEMP/layers-check/moc_drawinglayers.cpp"
          echo 'PASS: Layers widget, Xsheet bridge, regression test and Qt meta-object syntax checks'
          git add toonz/sources/toonz/drawinglayers.cpp toonz/sources/toonz/drawinglayers.h toonz/sources/toonz/drawinglayersxsheet.cpp toonz/sources/toonz/xshcellviewer.h toonz/sources/toonz/CMakeLists.txt .github/ot-dev/layers-tests/layers_test.cpp doc/layers-preview-and-exposure-menu.md
          git commit -m 'Add Layers hover previews and native exposure selection and menus'
          git push origin HEAD:refs/heads/maintenance/layers-155-result-20261002
          echo "LAYERS_RESULT_SHA=$(git rev-parse HEAD)"
          git show --stat --oneline HEAD
