name: Apply Export Scene ZIP implementation

on:
  push:
    branches:
      - export-scene-zip-option

permissions:
  contents: write

jobs:
  apply-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: export-scene-zip-option
      - name: Apply implementation
        run: python tools/apply_export_scene_zip.py
      - name: Remove setup files
        run: rm tools/apply_export_scene_zip.py .github/workflows/apply-export-scene-zip.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toonz/sources/toonz/exportscenepopup.cpp toonz/sources/toonz/exportscenepopup.h toonz/sources/toonz/simplezipwriter.h tools/apply_export_scene_zip.py .github/workflows/apply-export-scene-zip.yml
          git commit -m "Add ZIP option to standalone scene export"
          git push origin export-scene-zip-option
