name: MacOS Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  push:
    paths:
      - '**/*'                                  # Include all files in the repository
      - '!appveyor.yml'                         # Ignore changes in AppVeyor
      - '!README.md'                            # Exclude README
      - '!doc/**'                               # Exclude documentation
      - '!**/.github/**'                        # Exclude everything in .github folder
      - '.github/workflows/workflow_macos.yml'  # Include MacOs workflow file
      - '.github/scripts/build-macos-opencv.sh'
  pull_request:
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_macos.yml'
      - '.github/scripts/build-macos-opencv.sh'

jobs:
  macOS:
    timeout-minutes: 180 # Stop job if it exceeds expected build time
    # GHA are sunsetting support for macOS 13 (Intel & Apple Silicon/arm) & will be fully unsupported on (December 4th 2025),
    # See: https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/ & https://github.com/actions/runner-images/issues/13046
    # (Septemer 19th 2025) - Replacing `macos-13` runner image with the new `macos-15-intel` runner image to maintain macOS (Intel x64) support.
    # See: https://github.com/actions/runner-images/issues/13045
    # GHA (x86_64) SUNSETTING SUPPORT DEADLINE WARNING!!! `macos-15-intel` runner image will be the last available x86_64 image from Actions, and after (August 2027) the x86_64 architecture will not be supported on GitHub Actions.
    # Xref.: https://github.com/actions/runner-images/issues/13045
    # TODO: Change macOS GHA Runner Image to (Apple Silicon) based image on/prior to sunsetting of `macos-15-intel` (x86_64) runner image (August 2027)
    runs-on: macos-15-intel
    env:
      OPENCV_VERSION: '5.0.0'
      OPENCV_SHA256: b0528f5a1d379d59d4701cb28c36e22214cc51cf64594e5b56f2d3e6c0233095
      OPENCV_ROOT: ${{ github.workspace }}/.ci-deps/opencv-install
    steps:
      - uses: actions/checkout@v6

      - name: Clean Python symlinks
        run: |
          # Remove potentially conflicting Python symlinks
          find /usr/local/bin -type l \( -name "python*" -o -name "pip*" -o -name "2to3*" -o -name "idle*" -o -name "pydoc*" \) \
            -exec sh -c 'file -b {} | grep -q "symbolic link to .*Python.framework" && echo "Removing {}" && rm {}' \;
          # Ensure Homebrew Python is properly linked
          for py_version in python@3.11 python@3.12 python@3.13 python@3.14; do
            if brew list --versions $py_version >/dev/null; then
              brew unlink $py_version || true
            fi
          done
          brew link --overwrite --force python@3.14 || true

      - name: Install libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          checkPkgAndInstall() {
            for pkg in "$@"; do
              if brew ls --versions "$pkg" >/dev/null; then
                echo "$pkg already installed"
              else
                brew install "$pkg"
              fi
            done
          }

          checkPkgAndInstall pkg-config glew lz4 libjpeg libpng lzo boost libusb libmypaint ccache jpeg-turbo ninja openjph openexr

      # Temporary Qt 5 SDK until the Qt 6 port is ready. This removes the
      # Homebrew qt@5 install deadline, but does not make Qt 5 supported again.
      - name: Install Qt SDK
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '5.15.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtscript
          cache: true

      # Avoid Homebrew's deprecated opencv@4 and its full GUI/VTK dependency tree.
      - name: Identify OpenCV build environment
        id: opencv-environment
        run: |
          xcrun clang --version > "$RUNNER_TEMP/opencv-environment.txt"
          brew list --versions >> "$RUNNER_TEMP/opencv-environment.txt"
          echo "key=$(shasum -a 256 "$RUNNER_TEMP/opencv-environment.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.OPENCV_ROOT }}
          key: macos-15-${{ runner.arch }}-opencv-${{ env.OPENCV_VERSION }}-${{ steps.opencv-environment.outputs.key }}-${{ hashFiles('.github/scripts/build-macos-opencv.sh') }}

      - name: Build OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-macos-opencv.sh

      - name: Set up cache
        run: |
          export PATH="/usr/local/opt/ccache/libexec:$PATH"
          mkdir -p /Users/runner/.ccache
      - uses: actions/cache@v5
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-lzma
          make -j $(sysctl -n hw.ncpu)
          make install  # Ensures CMake finds the installed lib (avoid linking issues)
      - name: Build
        run: |
          export PKG_CONFIG_PATH="/usr/local/opt/jpeg-turbo/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd toonz
          rm -rf build  
          mkdir -p build
          cd build
          cmake ../sources -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DQT_PATH="$QT_ROOT_DIR/lib" \
            -DQt5_DIR="$QT_ROOT_DIR/lib/cmake/Qt5" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DOpenCV_DIR="$OPENCV_ROOT/lib/cmake/opencv5" \
            -DWITH_TRANSLATION=OFF
          ninja -j $(sysctl -n hw.ncpu)
      - name: Introduce Libraries and Stuff
        run: |
          cd toonz/build/toonz
          cp -pr ../../../stuff OpenToonz.app/portablestuff
          "$QT_ROOT_DIR/bin/macdeployqt" OpenToonz.app -verbose=0 -always-overwrite \
            -executable=OpenToonz.app/Contents/MacOS/lzocompress \
            -executable=OpenToonz.app/Contents/MacOS/lzodecompress \
            -executable=OpenToonz.app/Contents/MacOS/tcleanup \
            -executable=OpenToonz.app/Contents/MacOS/tcomposer \
            -executable=OpenToonz.app/Contents/MacOS/tconverter \
            -executable=OpenToonz.app/Contents/MacOS/tfarmcontroller \
            -executable=OpenToonz.app/Contents/MacOS/tfarmserver
      - name: Modify Library Paths
        run: |
          cd toonz/build/toonz/OpenToonz.app/Contents/Frameworks
          for TARGETLIB in *.dylib; do
            otool -L "$TARGETLIB" | grep ".dylib" | grep -v "$TARGETLIB" | grep -v "@executable_path/../Frameworks" | awk '{print $1}' | while read -r FROMPATH; do
              LIBNAME=$(basename "$FROMPATH")
              if [[ -e ./$LIBNAME ]]; then
                install_name_tool -change "$FROMPATH" "@executable_path/../Frameworks/$LIBNAME" "$TARGETLIB"
              fi
            done
          done
      - name: Create Artifact
        run: |
          cd toonz/build/toonz
          echo "Creating DMG..."
          ATTEMPT=1
          until "$QT_ROOT_DIR/bin/macdeployqt" OpenToonz.app -dmg -verbose=0 && [ -f OpenToonz.dmg ]; do
            echo "Attempt $ATTEMPT failed to build DMG."
            if [ $ATTEMPT -eq 10 ]; then
              echo ">>> DMG file creation failed after 10 attempts. Aborting!"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Retrying in 5 seconds..."
            sleep 5
          done
          echo "DMG created successfully."
      - uses: actions/upload-artifact@v6
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
