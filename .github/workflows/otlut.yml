name: OTLUT generator tests
on:
  pull_request:
    paths:
      - 'thirdparty/otlut/**'
      - 'toonz/sources/otlut/**'
      - '.github/workflows/otlut.yml'
  push:
    paths:
      - 'thirdparty/otlut/**'
      - 'toonz/sources/otlut/**'
      - '.github/workflows/otlut.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          persist-credentials: false
      - name: Configure
        run: cmake -S toonz/sources/otlut -B otlut-tests -DOTLUT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build otlut-tests --config Release --parallel 2
      - name: Test
        run: ctest --test-dir otlut-tests -C Release --output-on-failure
