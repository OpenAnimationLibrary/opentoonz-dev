name: Stage upstream Camera Capture controls fix

on:
  push:
    branches:
      - camera-capture-controls-upstream-work
    paths:
      - .github/workflows/tmp-camera-capture-controls-upstream.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camera-capture-controls-upstream-work
          fetch-depth: 0

      - name: Apply two-line bugfix
        shell: python
        run: |
          from pathlib import Path
          p = Path('toonz/sources/toonz/penciltestpopup.cpp')
          s = p.read_text(encoding='utf-8')
          old1 = '  m_onionOpacityFld->setDisabled(true);\n'
          old2 = '  m_timerIntervalFld->setDisabled(true);\n'
          assert s.count(old1) == 1
          assert s.count(old2) == 1
          s = s.replace(old1, '', 1).replace(old2, '', 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate source diff
        run: |
          git diff --check
          test "$(git diff --numstat HEAD -- toonz/sources/toonz/penciltestpopup.cpp)" = $'0\t2\ttoonz/sources/toonz/penciltestpopup.cpp'
          git diff HEAD -- toonz/sources/toonz/penciltestpopup.cpp

      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "Rodney"
          git config user.email "rodney.baker@gmail.com"
          rm .github/workflows/tmp-camera-capture-controls-upstream.yml
          git add -A
          git commit -m "Fix Camera Capture interval and onion skin controls"
          git push origin HEAD:camera-capture-controls-upstream-work
