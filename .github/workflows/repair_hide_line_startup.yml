name: One-shot Hide Line startup repair

on:
  push:
    branches:
      - agent/fix-hide-line-startup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-hide-line-startup

      - name: Apply deferred Hide Line integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          main_path = Path("toonz/sources/toonz/mainwindow.cpp")
          main = main_path.read_text(encoding="utf-8")

          main = replace_once(
              main,
              '#include "pltgizmopopup.h"\n#include "shortcutpopup.h"',
              '#include "pltgizmopopup.h"\n#include "sceneviewercontextmenu.h"\n#include "shortcutpopup.h"',
              "mainwindow include",
          )

          main = replace_once(
              main,
              '''  createToggle(MI_VectorGuidedDrawing, QT_TR_NOOP("Vector Guided Drawing"), "",
               Preferences::instance()->isGuidedDrawingEnabled(),
               MenuViewCommandType, "view_guided_drawing");
  if (QGLPixelBuffer::hasOpenGLPbuffers())''',
              '''  createToggle(MI_VectorGuidedDrawing, QT_TR_NOOP("Vector Guided Drawing"), "",
               Preferences::instance()->isGuidedDrawingEnabled(),
               MenuViewCommandType, "view_guided_drawing");
  createToggle(MI_ShowHideLineStrokes,
               QT_TR_NOOP("Hide Line: Show Invisible/Hidden Strokes"), "Shift+K",
               Preferences::instance()->getShowHideLineStrokes(),
               MenuViewCommandType);
  HideLineStrokeGui::syncCommandActionLabel();
  if (QGLPixelBuffer::hasOpenGLPbuffers())''',
              "Hide Line view action",
          )

          main = replace_once(
              main,
              '''  createToolAction(T_Eraser, "eraser", QT_TR_NOOP("Eraser Tool"), "E");
  createToolAction(T_Tape, "tape", QT_TR_NOOP("Tape Tool"), "T");''',
              '''  createToolAction(T_Eraser, "eraser", QT_TR_NOOP("Eraser Tool"), "E");
  createToolAction(T_HideLine, "hide_line", QT_TR_NOOP("Hide Line Tool"),
                   "K");
  createToolAction(T_Tape, "tape", QT_TR_NOOP("Tape Tool"), "T");''',
              "Hide Line tool action",
          )

          main = replace_once(
              main,
              '''  createAction(MI_EraserSegment, QT_TR_NOOP("Eraser Tool - Segment"), "",
               ToolCommandType, "eraser_segment");

  /*-- Tape tool + type/mode switching shortcuts --*/''',
              '''  createAction(MI_EraserSegment, QT_TR_NOOP("Eraser Tool - Segment"), "",
               ToolCommandType, "eraser_segment");

  /*-- Hide Line tool + type/mode/unhide switching shortcuts --*/
  createAction(MI_HideLineNextType, QT_TR_NOOP("Hide Line Tool - Next Type"),
               "", ToolCommandType);
  createAction(MI_HideLineNormal, QT_TR_NOOP("Hide Line Tool - Normal"), "",
               ToolCommandType);
  createAction(MI_HideLineSegment, QT_TR_NOOP("Hide Line Tool - Segment"), "",
               ToolCommandType);
  createAction(MI_HideLineFreehand, QT_TR_NOOP("Hide Line Tool - Freehand"),
               "", ToolCommandType);
  createAction(MI_HideLineNextMode, QT_TR_NOOP("Hide Line Tool - Next Mode"),
               "", ToolCommandType);
  createAction(MI_HideLineInvisible,
               QT_TR_NOOP("Hide Line Tool - Mode: Invisible"), "",
               ToolCommandType);
  createAction(MI_HideLineHidden, QT_TR_NOOP("Hide Line Tool - Mode: Hidden"),
               "", ToolCommandType);
  createAction(MI_HideLineToggleUnhide,
               QT_TR_NOOP("Hide Line Tool - Toggle Unhide"), "",
               ToolCommandType);

  /*-- Tape tool + type/mode switching shortcuts --*/''',
              "Hide Line shortcut actions",
          )

          main = replace_once(
              main,
              '''  createToolOptionsAction("A_ToolOption_Mode:Line to Line",
                          QT_TR_NOOP("Mode - Line to Line"), "");
  createToolOptionsAction("A_ToolOption_Type", QT_TR_NOOP("Type"), "");''',
              '''  createToolOptionsAction("A_ToolOption_Mode:Line to Line",
                          QT_TR_NOOP("Mode - Line to Line"), "");
  createToolOptionsAction("A_ToolOption_Mode:Invisible",
                          QT_TR_NOOP("Mode - Invisible"), "");
  createToolOptionsAction("A_ToolOption_Mode:Hidden",
                          QT_TR_NOOP("Mode - Hidden"), "");
  createToolOptionsAction("A_ToolOption_Unhide", QT_TR_NOOP("Unhide"), "");
  createToolOptionsAction("A_ToolOption_Type", QT_TR_NOOP("Type"), "");''',
              "Hide Line tool options",
          )

          main_path.write_text(main, encoding="utf-8")

          stage_path = Path("toonz/sources/toonzlib/stagevisitor.cpp")
          stage = stage_path.read_text(encoding="utf-8")
          stage = replace_once(
              stage,
              '''  rd.m_show0ThickStrokes     = prefs.getShow0ThickLines();
  rd.m_regionAntialias       = prefs.getRegionAntialias();''',
              '''  rd.m_show0ThickStrokes     = prefs.getShow0ThickLines();
  rd.m_showHideLineStrokes   = prefs.getShowHideLineStrokes();
  rd.m_regionAntialias       = prefs.getRegionAntialias();''',
              "Hide Line render-data propagation",
          )
          stage_path.write_text(stage, encoding="utf-8")
          PY

      - name: Verify repair
        shell: bash
        run: |
          git diff --check
          grep -F 'createToolAction(T_HideLine' toonz/sources/toonz/mainwindow.cpp
          grep -F 'createToggle(MI_ShowHideLineStrokes' toonz/sources/toonz/mainwindow.cpp
          grep -F 'rd.m_showHideLineStrokes   = prefs.getShowHideLineStrokes();' toonz/sources/toonzlib/stagevisitor.cpp

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toonz/sources/toonz/mainwindow.cpp toonz/sources/toonzlib/stagevisitor.cpp
          git rm .github/workflows/repair_hide_line_startup.yml
          git commit -m "Complete Hide Line startup integration"
          git push origin HEAD:agent/fix-hide-line-startup
