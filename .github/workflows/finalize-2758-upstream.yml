name: Finalize issue 2758 upstream patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-a/fix-vector-palette-order-2758-clean
          fetch-depth: 0

      - name: Tighten comment and formatting
        shell: python
        run: |
          from pathlib import Path

          path = Path("toonz/sources/image/pli/tiio_pli.cpp")
          source = path.read_text()
          old = '''  // Write styles in their displayed page order. The PLI format stores the page
          // index but not the position within the page, so the reader reconstructs
          // that position from the order of the style tags.
          for (int pageIndex = 0; pageIndex < vPalette->getPageCount(); pageIndex++) {
            TPalette::Page *page = vPalette->getPage(pageIndex);
            for (int styleIndex = 0; styleIndex < page->getStyleCount();
                 styleIndex++) {
              int styleId = page->getStyleId(styleIndex);
              if (styleId <= 0) continue;

              TColorStyle *style = vPalette->getStyle(styleId);
              std::vector<TStyleParam> stream;
              PliOutputStream chan(&stream);
              style->save(chan);  // viene riempito lo stream;

              assert(pageIndex >= 0 && pageIndex <= 65535);
              StyleTag *styleTag =
                  new StyleTag(styleId, pageIndex, stream.size(), stream.data());
              pli->m_palette_tags.push_back((PliObjectTag *)styleTag);
            }
          }
          '''
          new = '''  // Write styles in displayed page order. PLI stores page index but not
          // position within a page. The reader reconstructs it from style tag order.
          for (int pageIndex = 0; pageIndex < vPalette->getPageCount(); pageIndex++) {
            TPalette::Page *page = vPalette->getPage(pageIndex);
            for (int styleIndex = 0; styleIndex < page->getStyleCount();
                 styleIndex++) {
              int styleId = page->getStyleId(styleIndex);
              if (styleId <= 0) continue;

              TColorStyle *style = vPalette->getStyle(styleId);
              std::vector<TStyleParam> stream;
              PliOutputStream chan(&stream);
              style->save(chan);  // viene riempito lo stream;

              assert(pageIndex >= 0 && pageIndex <= 65535);
              StyleTag *styleTag = new StyleTag(
                  styleId, pageIndex, stream.size(), stream.data());
              pli->m_palette_tags.push_back((PliObjectTag *)styleTag);
            }
          }
          '''
          if old not in source:
              raise SystemExit("Expected issue 2758 block not found")
          path.write_text(source.replace(old, new, 1))

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/finalize-2758-upstream.yml
          git config user.name "Rodney Baker"
          git config user.email "2576432+RodneyBaker@users.noreply.github.com"
          git add toonz/sources/image/pli/tiio_pli.cpp .github/workflows/finalize-2758-upstream.yml
          git commit -m "Tighten vector palette order fix"
          git push origin HEAD:phase-a/fix-vector-palette-order-2758-clean
