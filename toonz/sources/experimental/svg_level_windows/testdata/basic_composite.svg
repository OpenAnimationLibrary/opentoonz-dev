<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79bfff"/>
      <stop offset="1" stop-color="#e8f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="8" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <g transform="translate(320 180) rotate(-8)" filter="url(#shadow)">
    <rect x="-210" y="-86" width="420" height="172" rx="28" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M-165 28 C-105 -78, 60 88, 165 -18" fill="none" stroke="#1769aa" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-152" cy="-28" r="16" fill="#ff9f1c"/>
    <circle cx="152" cy="28" r="16" fill="#2ec4b6"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">Experimental SVG Level</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="18" fill="#365b78">Editable text in the retained source</text>
  </g>
</svg>
